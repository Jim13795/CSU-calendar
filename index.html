<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>產學攜手日曆 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f14; --surface:#1a1a24; --surface2:#22222f; --border:#2e2e40;
    --accent:#7c6cfc; --accent2:#fc6c8f;
    --text:#e8e8f0; --muted:#6060a0;
    --work:#4a90d9; --rest:#4ecb8d; --school:#b07cfc; --red:#fc6c8f;
    --lunar-yi:#4ecb8d; --lunar-ji:#fc6c8f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden}

  /* ── Header ── */
  .hdr{padding:20px 20px 0;position:sticky;top:0;z-index:100;background:var(--bg)}
  .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .title{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--muted)}
  .badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .mtitle{text-align:center}
  .mname{font-size:28px;font-weight:900;letter-spacing:-1px}
  .yname{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px}
  .nbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:all .15s}
  .nbtn:active{transform:scale(.88)}

  /* ── Legend ── */
  .legend{display:flex;gap:10px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}
  .li{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;color:var(--muted)}
  .ld{width:9px;height:9px;border-radius:3px}

  /* ── Weekdays ── */
  .wdays{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;margin-bottom:6px}
  .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:5px 0}

  /* ── Calendar grid ── */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:3px;animation:fi .25s ease}
  @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:transform .12s;padding:2px;overflow:hidden}
  .c:active{transform:scale(.85)}
  .c.empty{cursor:default}
  .c.work{background:rgba(252,108,143,.15)}
  .c.rest{background:rgba(78,203,141,.15)}
  .c.school{background:rgba(74,144,217,.15);outline:2px solid rgba(74,144,217,.5);outline-offset:-2px}
  .c.override-work{background:rgba(252,108,143,.15);outline:2px solid rgba(248,169,75,.6);outline-offset:-2px}
  .c.override-rest{background:rgba(78,203,141,.15);outline:2px solid rgba(248,169,75,.6);outline-offset:-2px}
  .c.holiday{background:rgba(255,200,0,.18);outline:2px solid rgba(255,200,0,.6);outline-offset:-2px}
  .c.today .dn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .c.sel{border:1.5px solid var(--accent)}
  .dn{font-size:14px;font-weight:500;width:27px;height:27px;display:flex;align-items:center;justify-content:center}
  .c.sun .dn{color:var(--red)}
  .c.sat .dn{color:#7c9cfc}
  .c.weekend{opacity:.25;cursor:default;pointer-events:none}
  .dots{display:flex;gap:2px;margin-top:2px;min-height:5px}
  .dot{width:4px;height:4px;border-radius:50%}

  /* ── Summary ── */
  .sum{display:flex;padding:10px 18px;gap:8px;margin-top:6px}
  .chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center}
  .cn{font-size:20px;font-weight:900;font-family:'DM Mono',monospace;line-height:1}
  .cl{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500}

  /* ── Detail panel ── */
  .divline{height:1px;background:var(--border);margin:0 10px}
  .panel{margin:12px 10px 0;background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden}
  .phdr{padding:13px 16px 10px;display:flex;align-items:center;border-bottom:1px solid var(--border);gap:8px}
  .pdate{font-size:13px;font-weight:700;flex:1}
  .pcnt{font-size:11px;color:var(--muted)}
  .edit-btn{background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans TC',sans-serif}
  .edit-btn:active{opacity:.7}
  
  /* 農民曆區塊 */
  .lunar-box{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px}
  .lunar-row{display:flex;align-items:center;gap:10px}
  .lunar-tag{font-weight:900;padding:2px 6px;border-radius:6px;font-size:10px;color:#fff}
  .lunar-tag.yi{background:var(--lunar-yi)}
  .lunar-tag.ji{background:var(--lunar-ji)}
  .lunar-text{color:var(--text);font-weight:500;letter-spacing:0.5px}

  .evs{padding:6px 0}
  .ev{display:flex;align-items:flex-start;padding:10px 16px;gap:12px}
  .ebar{width:3px;min-height:36px;border-radius:2px;flex-shrink:0;margin-top:2px}
  .einfo{flex:1;min-width:0}
  .ename{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .esub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace;line-height:1.7}
  .etag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  
  /* 鬧鐘按鈕 */
  .alarm-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px;line-height:1;align-self:center;transition:color .15s}
  .alarm-btn:hover, .alarm-btn:active{color:#ffb703}

  .del-btn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;line-height:1;align-self:center}
  .del-btn:active{color:var(--red)}
  .nomsg{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
  
  .weather-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .weather-icon{font-size:24px;line-height:1}
  .weather-info{flex:1}
  .weather-temp{font-size:15px;font-weight:700;font-family:'DM Mono',monospace}
  .weather-desc{font-size:11px;color:var(--muted);margin-top:2px}
  .weather-loading{font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border)}

  /* ── Bottom sheet ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
  .overlay.show{opacity:1;pointer-events:all}
  .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--border);z-index:201;transition:transform .3s cubic-bezier(.32,0,.67,0);padding-bottom:env(safe-area-inset-bottom,16px)}
  .sheet.show{transform:translateX(-50%) translateY(0)}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
  .sheet-title{font-size:15px;font-weight:700;padding:16px 20px 4px;display:flex;align-items:center;gap:8px}
  .sheet-date{font-size:12px;color:var(--muted);font-weight:400}
  .sheet-section{padding:12px 20px 0}
  .section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:10px;text-transform:uppercase}

  /* Toggle work/rest */
  .toggle-row{display:flex;gap:8px}
  .toggle-opt{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all .15s;user-select:none}
  .toggle-opt:active{transform:scale(.95)}
  .toggle-opt.active-work{border-color:var(--work);background:rgba(74,144,217,.15)}
  .toggle-opt.active-rest{border-color:var(--rest);background:rgba(78,203,141,.15)}
  .toggle-opt .opt-icon{font-size:18px;margin-bottom:4px}
  .toggle-opt .opt-label{font-size:12px;font-weight:700}
  .toggle-opt .opt-sub{font-size:10px;color:var(--muted);margin-top:2px}

  /* Reset override */
  .reset-btn{display:block;width:100%;margin-top:8px;padding:10px;background:none;border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
  .reset-btn:active{background:var(--surface2)}

  /* Add event form */
  .form-row{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
  .finput{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13px;font-family:'Noto Sans TC',sans-serif;width:100%;outline:none;transition:border .15s}
  .finput:focus{border-color:var(--accent)}
  .finput::placeholder{color:var(--muted)}
  .frow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .add-btn{width:100%;margin-top:10px;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:opacity .15s}
  .add-btn:active{opacity:.8}

  /* Custom events list in sheet */
  .custom-ev-list{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .custom-ev-item{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 14px;border:1px solid var(--border)}
  .custom-ev-item .cev-info{flex:1;min-width:0}
  .custom-ev-item .cev-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .custom-ev-item .cev-sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px}
  .cev-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px;line-height:1}
  .cev-del:active{color:var(--red)}

  .sheet-close{position:absolute;top:14px;right:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bot{height:40px}

  /* ── Disclaimer modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:24px;max-width:360px;width:100%;padding:28px 24px;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .modal-icon{font-size:36px;text-align:center;margin-bottom:12px}
  .modal-title{font-size:17px;font-weight:900;text-align:center;margin-bottom:8px}
  .modal-body{font-size:13px;color:var(--muted);line-height:1.8;text-align:center;margin-bottom:20px}
  .modal-body strong{color:var(--text)}
  .modal-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
  .modal-btn:active{opacity:.85}
</style>
</head>
<body>

<div class="modal-overlay" id="disclaimer">
  <div class="modal">
    <div class="modal-icon">🤖</div>
    <div class="modal-title">使用前請注意</div>
    <div class="modal-body">
      本日曆由 <strong>AI 輔助製作</strong>，課程時間與上班排班資訊僅供參考。<br><br>
      若發現任何錯誤或資料有誤，請多多包涵，<br>並請通知製作人進行修正。<br><br>
      <strong>感謝您的使用！</strong>
    </div>
    <button class="modal-btn" onclick="closeDisclaimer()">我知道了</button>
  </div>
</div>

<div class="hdr">
  <div class="hdr-top">
    <div class="title">產學攜手計畫 2026</div>
    <div class="badge">資工二丁 · 華泰F組</div>
  </div>
  <div class="mnav">
    <button class="nbtn" onclick="go(-1)">‹</button>
    <div class="mtitle">
      <div class="mname" id="mname"></div>
      <div class="yname">2026 年</div>
    </div>
    <button class="nbtn" onclick="go(1)">›</button>
  </div>
</div>

<div class="legend">
  <div class="li"><div class="ld" style="background:rgba(252,108,143,.6)"></div>上班</div>
  <div class="li"><div class="ld" style="background:rgba(74,144,217,.6)"></div>休息有課</div>
  <div class="li"><div class="ld" style="background:rgba(78,203,141,.6)"></div>休息無課</div>
  <div class="li"><div class="ld" style="background:rgba(248,169,75,.7)"></div>手動修改</div>
</div>

<div class="wdays">
  <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div>
  <div class="wd">三</div><div class="wd">四</div><div class="wd">五</div>
  <div class="wd">六</div>
</div>

<div class="cal" id="cal"></div>
<div class="sum" id="sum"></div>
<div class="divline"></div>

<div class="panel">
  <div class="phdr">
    <div class="pdate" id="pdate">請點選日期</div>
    <div class="pcnt" id="pcnt"></div>
    <button class="edit-btn" id="editBtn" style="display:none" onclick="openSheet()">✏️ 編輯</button>
  </div>
  <div id="weather-bar"></div>
  <div id="lunar-box" class="lunar-box" style="display:none"></div>
<div class="evs" id="evs"><div class="nomsg">點選日期查看行程</div></div>
</div>
<div class="bot"></div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" onclick="closeSheet()">✕</button>
  <div class="sheet-title">
    編輯日期
    <span class="sheet-date" id="sheetDate"></span>
  </div>

  <div class="sheet-section">
    <div class="section-label">上班狀態</div>
    <div class="toggle-row">
      <div class="toggle-opt" id="optWork" onclick="setOverride('work')">
        <div class="opt-icon">🏭</div>
        <div class="opt-label">上班</div>
        <div class="opt-sub">正常出勤</div>
      </div>
      <div class="toggle-opt" id="optRest" onclick="setOverride('rest')">
        <div class="opt-icon">🏠</div>
        <div class="opt-label">休息</div>
        <div class="opt-sub">不用去工廠</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetOverride()">↺ 恢復自動排班（作三休三）</button>
  </div>

  <div class="sheet-section" style="margin-top:6px">
    <div class="section-label">自訂事件</div>
    <div class="custom-ev-list" id="customEvList"></div>
  </div>

  <div class="sheet-section" style="margin-top:6px;padding-bottom:20px">
    <div class="section-label">新增事件</div>
    <div class="form-row">
      <input class="finput" id="fName" placeholder="事件名稱（例：補課、會議）" maxlength="30">
      <div class="frow2">
        <input class="finput" id="fTime" placeholder="時間（例：09:00–12:00）" maxlength="20">
        <input class="finput" id="fRoom" placeholder="教室（例：03B0704）" maxlength="15">
      </div>
    </div>
    <button class="add-btn" onclick="addCustomEv()">＋ 新增</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// 核心設定與資料排班
// ══════════════════════════════════════════
const START = new Date(2026, 1, 19);

function cycleStatus(m, d) {
  const diff = Math.round((new Date(2026, m-1, d) - START) / 86400000);
  return ((diff % 6) + 6) % 6 < 3 ? 'work' : 'rest';
}

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const DEFAULT_OVERRIDES = {'2-19':'rest','2-24':'work'};
let overrides = load('cal_overrides', DEFAULT_OVERRIDES);
let customEvs = load('cal_custom_evs', {});

function saveAll() {
  save('cal_overrides', overrides);
  save('cal_custom_evs', customEvs);
}

function status(m, d) {
  const k = `${m}-${d}`;
  return overrides[k] || cycleStatus(m, d);
}

function isOverridden(m, d) {
  return `${m}-${d}` in overrides;
}

const HOLIDAYS = {'4-6':'清明節','4-7':'清明節補假','5-1':'勞動節'};
const COURSES = {
  '2-23':[{n:'邏輯與思考（人文）',t:'08:10–12:00',r:'29-0404'},{n:'統計分析',t:'13:10–17:00',r:'03B0704'}],
  '3-2': [{n:'3D列印實務',t:'09:10–12:00',r:'03B0704'},{n:'物聯網系統概論',t:'13:10–15:00',r:'03B0704'},{n:'網頁程式設計',t:'15:10–18:00',r:'03B0704'}],
  '3-6': [{n:'邏輯與思考（人文）',t:'08:10–12:00',r:'29-0404'}],
  '3-12':[{n:'統計分析',t:'08:10–12:00',r:'03C0701'}],
  '3-13':[{n:'3D列印實務',t:'08:10–12:00',r:'03C0602'},{n:'網頁程式設計',t:'13:10–16:00',r:'03C0602'}],
  '3-18':[{n:'物聯網系統概論',t:'09:10–12:00',r:'03B0704'}],
  '3-20':[{n:'3D列印實務',t:'08:10–12:00',r:'03C0602'},{n:'網頁程式設計',t:'13:10–16:00',r:'03C0602'}],
  '3-25':[{n:'物聯網系統概論',t:'09:10–12:00',r:'03B0704'}],
  '3-26':[{n:'邏輯與思考（人文）',t:'08:10–12:00',r:'11-0805'},{n:'網頁程式設計',t:'13:10–17:00',r:'03C0602'}],
  '4-6': [{n:'⚠️ 群組公告這兩天不上課',t:'',r:''},{n:'3D列印實務',t:'09:10–12:00',r:'03C0602'},{n:'物聯網系統概論',t:'13:10–15:00',r:'03B0704'}],
  '4-7': [{n:'⚠️ 群組公告這兩天不上課',t:'',r:''},{n:'網頁程式設計',t:'09:10–12:00',r:'03C0602'},{n:'統計分析',t:'13:10–17:00',r:'03B0704'}],
  '4-13':[{n:'3D列印實務',t:'09:10–12:00',r:'03B0704'},{n:'網頁程式設計',t:'13:10–17:00',r:'03B0704'}],
  '4-17':[{n:'邏輯與思考（人文）',t:'08:10–12:00',r:'29-0404'},{n:'統計分析',t:'13:10–17:00',r:'03C0602'}],
  '4-24':[{n:'邏輯與思考（人文）',t:'08:10–12:00',r:'29-0404'},{n:'⚠️ 中午起至晚上停課',t:'',r:''},{n:'統計分析',t:'13:10–17:00',r:'03B0704'}],
  '4-29':[{n:'物聯網系統概論',t:'09:10–12:00',r:'03B0704'}],
  '5-1': [{n:'⚠️ 勞動節，請確認是否照常上課',t:'',r:''},{n:'3D列印實務',t:'08:10–12:00',r:'03C0602'},{n:'網頁程式設計',t:'15:10–17:00',r:'03C0602'}],

// 鬧鐘行事曆 ICS 匯出功能
// ══════════════════════════════════════════
function addAlarmToCalendar(title, timeStr, room, m, d) {
  let startHour = 8, startMin = 0, endHour = 17, endMin = 0;
  if (timeStr && timeStr.includes('–')) {
    const parts = timeStr.split('–');
    const sParts = parts[0].split(':');
    const eParts = parts[1].split(':');
    if(sParts.length === 2) { startHour = parseInt(sParts[0]); startMin = parseInt(sParts[1]); }
    if(eParts.length === 2) { endHour = parseInt(eParts[0]); endMin = parseInt(eParts[1]); }
  } else if (title.includes('正常出勤')) {
    startHour = 7; startMin = 35; endHour = 19; endMin = 35;
  }
  const pad = num => String(num).padStart(2, '0');
  const dateStr = `2026${pad(m)}${pad(d)}`;
  const icsDSTAMP = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const icsSTART = `${dateStr}T${pad(startHour)}${pad(startMin)}00`;
  const icsEND = `${dateStr}T${pad(endHour)}${pad(endMin)}00`;

  const icsContent = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//OSE CSU Calendar//Alarm//TW', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `DTSTAMP:${icsDSTAMP}`, `DTSTART;TZID=Asia/Taipei:${icsSTART}`, `DTEND;TZID=Asia/Taipei:${icsEND}`,
    `SUMMARY:${title}`, `LOCATION:${room || '華泰電子 / 學校教室'}`, 'DESCRIPTION:日曆自動同步，內含前 15 分鐘鬧鐘提醒。',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:REMINDER', 'TRIGGER:-PT15M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.setAttribute('download', `${m}月${d}日_${title}_鬧鐘提醒.ics`);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

// 農民曆宜忌演算法
// ══════════════════════════════════════════
const YI_LIST = ['開市', '嫁娶', '動土', '出行', '祈福', '納財', '安床', '祭祀', '沐浴', '理髮', '掃舍', '入宅', '修造', '裁衣', '交易'];
const JI_LIST = ['諸事不宜', '作灶', '安葬', '伐木', '詞訟', '針灸', '掘井', '搬家', '破土', '動土', '移徙', '出火', '詞訟', '探病', '修造'];

function getLunarFortune(m, d) {
  let seed = 2026 * m + d * 31;
  function random() { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
  let yiCount = Math.floor(random() * 3) + 2, jiCount = Math.floor(random() * 3) + 2;
  let yiArr = [], jiArr = [], tempYi = [...YI_LIST], tempJi = [...JI_LIST];
  for(let i=0; i<yiCount; i++) { yiArr.push(tempYi.splice(Math.floor(random() * tempYi.length), 1)[0]); }
  for(let i=0; i<jiCount; i++) { jiArr.push(tempJi.splice(Math.floor(random() * tempJi.length), 1)[0]); }
  if(jiArr.includes('諸事不宜')) jiArr = ['諸事不宜'];
  return { yi: yiArr.join('、'), ji: jiArr.join('、') };
}

function renderLunar(m, d) {
  const box = document.getElementById('lunar-box'); if(!box) return;
  box.style.display = 'flex'; const f = getLunarFortune(m, d);
  box.innerHTML = `
    <div class="lunar-row"><span class="lunar-tag yi">宜</span><span class="lunar-text">${f.yi}</span></div>
    <div class="lunar-row"><span class="lunar-tag ji">忌</span><span class="lunar-text">${f.ji}</span></div>`;
}

// ══════════════════════════════════════════
// 高雄即時天氣 API
// ══════════════════════════════════════════
const WEATHER_CACHE = {};
const WMO_CODE = {
  0:'☀️ 晴天',1:'🌤️ 大致晴朗',2:'⛅ 部分多雲',3:'☁️ 陰天',
  45:'🌫️ 霧',48:'🌫️ 霜霧',51:'🌦️ 毛毛雨',53:'🌦️ 毛毛雨',55:'🌦️ 毛毛雨',
  61:'🌧️ 小雨',63:'🌧️ 中雨',65:'🌧️ 大雨',71:'🌨️ 小雪',73:'🌨️ 中雪',75:'🌨️ 大雪',
  80:'🌦️ 陣雨',81:'🌧️ 陣雨',82:'⛈️ 強陣雨',95:'⛈️ 雷雨',96:'⛈️ 雷雨夾冰雹',99:'⛈️ 雷雨夾冰雹',
};

async function fetchWeather(m, d){
  const key = `${m}-${d}`; if(WEATHER_CACHE[key]) return WEATHER_CACHE[key];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=22.63&longitude=120.27&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&timezone=Asia%2FTaipei`;
    const res = await fetch(url); if(!res.ok) return null;
    const data = await res.json();
    if(data.current){
      const result = { code: data.current.weather_code, temp: Math.round(data.current.temperature_2m), feel: Math.round(data.current.apparent_temperature), humidity: data.current.relative_humidity_2m };
      WEATHER_CACHE[key] = result; return result;
    }
  } catch(e) {}
  return null;
}

function renderWeather(m, d){
  const bar = document.getElementById('weather-bar'); if(!bar) return;
  bar.innerHTML = '<div class="weather-loading">🌐 載入即時天氣中...</div>';
  fetchWeather(m, d).then(w => {
    if(!w){ bar.innerHTML=''; return; }
    const desc = WMO_CODE[w.code] || '🌡️ 未知';
    bar.innerHTML = `<div class="weather-bar">
      <div class="weather-icon">${desc.split(' ')[0]}</div>
      <div class="weather-info">
        <div class="weather-temp">現在溫度 ${w.temp}°C ｜ 體感 ${w.feel}°C</div>
        <div class="weather-desc">${desc.split(' ').slice(1).join(' ')} ｜ 濕度 ${w.humidity}% ｜ 高雄即時天氣</div>
      </div>
    </div>`;
  });
}

function render(){

function renderCal(){
  const cal=document.getElementById('cal'); cal.innerHTML='';
  const first=new Date(2026,curM-1,1).getDay();
  const total=new Date(2026,curM,0).getDate();

  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='c empty'; cal.appendChild(e); }

  for(let d=1;d<=total;d++){
    const dow=new Date(2026,curM-1,d).getDay(), isSun=dow===0, isSat=dow===6;
    const st=status(curM,d), ov=isOverridden(curM,d);
    const courses=(COURSES[`${curM}-${d}`]||[]), cevs=customEvs[`${curM}-${d}`]||[];
    const isToday=today.getFullYear()===2026&&today.getMonth()+1===curM&&today.getDate()===d;
    const cell=document.createElement('div'); let cls='c';

    if(ov){ cls += st==='work' ? ' override-work' : ' override-rest'; }
    else if(courses.length>0 && st==='rest'){ cls+=' school'; }
    else if(st==='rest'){ cls+=' rest'; }
    else { cls+=' work'; }

    if(HOLIDAYS[`${curM}-${d}`]) cls+=' holiday';
    if(isToday) cls+=' today';
    if(isSun) cls+=' sun'; if(isSat) cls+=' sat';
    if(sel===d) cls+=' sel';
    cell.className=cls;

    const dn=document.createElement('div'); dn.className='dn'; dn.textContent=d; cell.appendChild(dn);

    if(courses.length>0||cevs.length>0){
      const dots=document.createElement('div'); dots.className='dots';
      if(courses.length>0){ const dot=document.createElement('div'); dot.className='dot'; dot.style.background='var(--work)'; dots.appendChild(dot); }
      if(cevs.length>0){ const dot=document.createElement('div'); dot.className='dot'; dot.style.background='#f8a94b'; dots.appendChild(dot); }
      cell.appendChild(dots);
    }
    cell.addEventListener('click',()=>{sel=d; render();}); cal.appendChild(cell);
  }
}

function renderSum(){
  const total=new Date(2026,curM,0).getDate();
  let work=0, rest=0, school=0;
  for(let d=1; d<=total; d++){
    if(status(curM,d)==='work') work++; else rest++;
    const dow=new Date(2026,curM-1,d).getDay();
    if(!(dow===0||dow===6)&&(COURSES[`${curM}-${d}`]||[]).length>0) school++;
  }
  document.getElementById('sum').innerHTML=`
    <div class="chip"><div class="cn" style="color:var(--work)">${work}</div><div class="cl">上班天</div></div>
    <div class="chip"><div class="cn" style="color:var(--rest)">${rest}</div><div class="cl">休息天</div></div>
    <div class="chip"><div class="cn" style="color:var(--school)">${school}</div><div class="cl">上課天</div></div>`;
}

function showEv(d){
  const dow=new Date(2026,curM-1,d).getDay(), st=status(curM,d), ov=isOverridden(curM,d);
  const courses=(COURSES[`${curM}-${d}`]||[]), cevs=customEvs[`${curM}-${d}`]||[];
  document.getElementById('pdate').textContent=`${curM}月${d}日（${DN[dow]}）`;
  document.getElementById('editBtn').style.display='block';

  const evs=[]; const hday=HOLIDAYS[`${curM}-${d}`];
  if(hday){ evs.push({name:'🎌 '+hday, sub:'國定假日・請確認是否照常上課', color:'#f0c800', tag:'節日', tbg:'rgba(255,200,0,.15)', tc:'#c8a000', rawTime:'', rawRoom:'', hasAlarm:false}); }

  if(st==='work'){
    const sub = ov ? '⚠️ 手動設定上班' : '07:35–19:35 ｜ 華泰電子 F組';
    evs.push({name:'OSE 正常出勤', sub, color: ov?'#f8a94b':'var(--red)', tag:'上班', tbg: ov?'rgba(248,169,75,.12)':'rgba(252,108,143,.12)', tc: ov?'#f8a94b':'var(--red)', rawTime:'07:35–19:35', rawRoom:'華泰電子', hasAlarm:true});
  } else {
    const sub = ov ? '⚠️ 手動設定休息' : '華泰電子 F組・作三休三';
    evs.push({name:'OSE 休息日', sub, color: ov?'#f8a94b':'var(--rest)', tag:'休息', tbg: ov?'rgba(248,169,75,.12)':'rgba(78,203,141,.12)', tc: ov?'#f8a94b':'var(--rest)', rawTime:'', rawRoom:'', hasAlarm:false});
  }

  courses.forEach(c=>{
    if(c.n.startsWith('⚠️')){ evs.push({name:c.n, sub:'', color:'#f8a94b', tag:'提醒', tbg:'rgba(248,169,75,.15)', tc:'#f8a94b', rawTime:'', rawRoom:'', hasAlarm:false}); }
    else { evs.push({name:c.n, sub:`${c.t} ｜ ${c.r}`, color:'var(--work)', tag:'課程', tbg:'rgba(74,144,217,.15)', tc:'var(--work)', rawTime:c.t, rawRoom:c.r, hasAlarm:true}); }
  });

  cevs.forEach(c=>{ evs.push({name:c.n, sub:`${c.t||'–'} ｜ ${c.r||'–'}`, color:'#f8a94b', tag:'自訂', tbg:'rgba(248,169,75,.15)', tc:'#f8a94b', del:c.id, rawTime:c.t, rawRoom:c.r, hasAlarm:true}); });

  document.getElementById('pcnt').textContent=`${evs.length} 項`;
  renderWeather(curM, d); renderLunar(curM, d);
  
  document.getElementById('evs').innerHTML=evs.map(ev=>`
    <div class="ev">
      <div class="ebar" style="background:${ev.color}"></div>
      <div class="einfo"><div class="ename">${ev.name}</div><div class="esub">${ev.sub}</div></div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="etag" style="background:${ev.tbg};color:${ev.tc}">${ev.tag}</div>
        ${ev.hasAlarm ? `<button class="alarm-btn" title="設定手機鬧鐘提醒" onclick="addAlarmToCalendar('${ev.name}', '${ev.rawTime}', '${ev.rawRoom}', ${curM}, ${d})">⏰</button>` : ''}
        ${ev.del ? `<button class="del-btn" onclick="deleteCustomEv('${ev.del}')">×</button>` : ''}
      </div>
    </div>`).join('');
}

function deleteCustomEv(id){
  if(!sel) return; const key=`${curM}-${sel}`;
  if(customEvs[key]) { customEvs[key]=customEvs[key].filter(e=>e.id!==id); if(customEvs[key].length===0) delete customEvs[key]; saveAll(); render(); }

function addCustomEv(){
